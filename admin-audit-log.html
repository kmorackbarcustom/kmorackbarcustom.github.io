<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMO Audit Log</title>
  <style>
    :root {
      --bg: #101214;
      --panel: #181b1f;
      --border: #30343a;
      --text: #f5f5f5;
      --muted: #a8adb5;
      --accent: #ffcf07;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    h1 { margin: 0 0 8px; }
    .muted { color: var(--muted); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0c0e10;
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #050505;
      font-weight: 700;
      padding: 0 18px;
      cursor: pointer;
    }

    .secondary-btn {
      background: #2a2f36;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0c0e10;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: pre-wrap;
    }

    .status.error { border-color: var(--danger); color: #fecaca; }
    .status.success { border-color: var(--success); color: #bbf7d0; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
    }

    th { color: var(--muted); font-weight: 600; }

    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #0c0e10;
      border: 1px solid var(--border);
    }

    @media (max-width: 760px) {
      table { display: block; overflow-x: auto; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <main>
    <h1>KMO Audit Log</h1>
    <p class="muted">ประวัติ staff pause/resume/ตอบแทนลูกค้า — ล่าสุด 50 รายการ</p>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2 style="margin:0 0 4px;">Staff passcode</h2>
        </div>
        <button type="button" id="clearPasscodeBtn" class="secondary-btn">ล้าง passcode</button>
      </div>
      <label for="staffPasscode">รหัสพนักงาน</label>
      <input id="staffPasscode" type="password" autocomplete="current-password" placeholder="กรอกรหัสร้านก่อนใช้งาน">
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2 style="margin:0;">ประวัติล่าสุด</h2>
        <div style="display:flex; gap:10px; align-items:center;">
          <input id="filterInput" placeholder="กรองชื่อลูกค้า/ประเภทการกระทำ" style="min-width:220px;">
          <button type="button" id="reloadBtn" class="secondary-btn">โหลดใหม่</button>
        </div>
      </div>
      <div id="status" class="status" hidden></div>
      <div id="tableWrap"></div>
    </section>
  </main>

  <script>
    const SUPA_URL = 'https://xfhpwxjywqgqefbncumm.supabase.co';
    const FUNCTION_URL = `${SUPA_URL}/functions/v1/staff-reply`;
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmaHB3eGp5d3FncWVmYm5jdW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MjIxMTQsImV4cCI6MjA4ODM5ODExNH0.GRfJ8aY9FgfMw18Vld4m2R6mE2cOwUsJw3OXOJEt0is';
    const PASSCODE_KEY = 'kmo_audit_log_staff_key';

    const ACTION_LABELS = {
      'customer.reply_sent': 'ส่งข้อความ',
      'customer.ai_paused': 'หยุด AI',
      'customer.ai_resumed': 'เปิด AI กลับ',
    };

    const passcodeInput = document.getElementById('staffPasscode');
    const statusEl = document.getElementById('status');
    const tableWrap = document.getElementById('tableWrap');
    const filterInput = document.getElementById('filterInput');

    let allRecords = [];

    passcodeInput.value = sessionStorage.getItem(PASSCODE_KEY) || localStorage.getItem(PASSCODE_KEY) || '';

    document.getElementById('clearPasscodeBtn').addEventListener('click', () => {
      sessionStorage.removeItem(PASSCODE_KEY);
      localStorage.removeItem(PASSCODE_KEY);
      passcodeInput.value = '';
      setStatus('ล้าง passcode แล้ว', 'success');
    });

    passcodeInput.addEventListener('change', () => {
      const value = passcodeInput.value.trim();
      if (value) {
        sessionStorage.setItem(PASSCODE_KEY, value);
        localStorage.setItem(PASSCODE_KEY, value);
        loadHistory();
      }
    });

    function requireStaffKey() {
      const staffKey = passcodeInput.value.trim();
      if (!staffKey) {
        setStatus('กรุณากรอก staff passcode ก่อน', 'error');
        passcodeInput.focus();
        return null;
      }
      return staffKey;
    }

    async function loadHistory() {
      const staffKey = requireStaffKey();
      if (!staffKey) return;

      setStatus('กำลังโหลด...', '');
      try {
        const res = await fetch(`${FUNCTION_URL}/audit-log`, {
          method: 'POST',
          headers: {
            'apikey': SUPA_KEY,
            'Authorization': `Bearer ${SUPA_KEY}`,
            'Content-Type': 'application/json',
            'x-staff-key': staffKey,
          },
          body: JSON.stringify({}),
        });
        if (res.status === 401) {
          sessionStorage.removeItem(PASSCODE_KEY);
          localStorage.removeItem(PASSCODE_KEY);
          throw new Error('รหัสพนักงานไม่ถูกต้อง');
        }
        const json = await res.json();
        if (!res.ok || json.ok === false) throw new Error(json.error || `HTTP ${res.status}`);

        allRecords = json.records ?? [];
        setStatus(`โหลดแล้ว ${allRecords.length} รายการ`, 'success');
        applyFilter();
      } catch (error) {
        setStatus(`โหลดไม่สำเร็จ: ${error.message}`, 'error');
      }
    }

    function applyFilter() {
      const q = filterInput.value.trim().toLowerCase();
      const filtered = q
        ? allRecords.filter((r) =>
            (r.customerName || '').toLowerCase().includes(q) ||
            (ACTION_LABELS[r.action] || r.action || '').toLowerCase().includes(q)
          )
        : allRecords;
      render(filtered);
    }

    function detailOf(record) {
      if (record.action === 'customer.reply_sent') return record.after?.message || '-';
      if (record.after?.pausedUntil) return `ถึง ${new Date(record.after.pausedUntil).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' })}`;
      return '-';
    }

    function render(records) {
      tableWrap.replaceChildren();
      if (records.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'muted';
        empty.textContent = 'ไม่มีรายการ';
        tableWrap.appendChild(empty);
        return;
      }

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>เวลา</th><th>การกระทำ</th><th>ลูกค้า</th><th>โดย</th><th>รายละเอียด</th></tr>';
      const tbody = document.createElement('tbody');

      records.forEach((r) => {
        const tr = document.createElement('tr');

        const time = document.createElement('td');
        time.textContent = new Date(r.timestamp).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });

        const action = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = ACTION_LABELS[r.action] || r.action;
        action.appendChild(badge);

        const customer = document.createElement('td');
        customer.textContent = r.customerName || r.entity?.id || '-';

        const actor = document.createElement('td');
        actor.textContent = r.actor?.id || (r.actor?.type === 'staff' ? 'staff (ไม่ระบุตัวตน)' : r.actor?.type || '-');

        const detail = document.createElement('td');
        detail.textContent = detailOf(r);

        tr.append(time, action, customer, actor, detail);
        tbody.appendChild(tr);
      });

      table.append(thead, tbody);
      tableWrap.appendChild(table);
    }

    function setStatus(message, type) {
      statusEl.hidden = false;
      statusEl.className = `status${type ? ` ${type}` : ''}`;
      statusEl.textContent = message;
    }

    filterInput.addEventListener('input', applyFilter);
    document.getElementById('reloadBtn').addEventListener('click', loadHistory);
    if (passcodeInput.value.trim()) loadHistory();
  </script>
</body>
</html>
