<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMO Audit Log</title>
  <style>
    :root {
      --bg: #101214;
      --panel: #181b1f;
      --border: #30343a;
      --text: #f5f5f5;
      --muted: #a8adb5;
      --accent: #ffcf07;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    h1 { margin: 0 0 8px; }
    .muted { color: var(--muted); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0c0e10;
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #050505;
      font-weight: 700;
      padding: 0 18px;
      cursor: pointer;
    }

    .secondary-btn {
      background: #2a2f36;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0c0e10;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: pre-wrap;
    }

    .status.error { border-color: var(--danger); color: #fecaca; }
    .status.success { border-color: var(--success); color: #bbf7d0; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 9px 8px;
      text-align: left;
      vertical-align: top;
    }

    th { color: var(--muted); font-weight: 600; }

    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #0c0e10;
      border: 1px solid var(--border);
    }

    @media (max-width: 760px) {
      table { display: block; overflow-x: auto; white-space: nowrap; }
    }
  </style>
</head>
<body>
  <main>
    <h1>KMO Audit Log</h1>
    <p class="muted">ประวัติ staff pause/resume/ตอบแทนลูกค้า — ล่าสุด 50 รายการ</p>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2 style="margin:0 0 4px;">Staff passcode</h2>
        </div>
        <button type="button" id="clearPasscodeBtn" class="secondary-btn">ล้าง passcode</button>
      </div>
      <label for="staffPasscode">รหัสพนักงาน</label>
      <input id="staffPasscode" type="password" autocomplete="current-password" placeholder="กรอกรหัสร้านก่อนใช้งาน">
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2 style="margin:0;">ประวัติล่าสุด</h2>
        <div style="display:flex; gap:10px; align-items:center;">
          <input id="filterInput" placeholder="กรองชื่อลูกค้า/ประเภทการกระทำ" style="min-width:220px;">
          <button type="button" id="reloadBtn" class="secondary-btn">โหลดใหม่</button>
        </div>
      </div>
      <div id="status" class="status" hidden></div>
      <div id="tableWrap"></div>
    </section>
  </main>

  <script>
    const SUPA_URL = 'https://xfhpwxjywqgqefbncumm.supabase.co';
    const FUNCTION_URL = `${SUPA_URL}/functions/v1/staff-reply`;
    const SUPA_KEY = 'sb_publishable_8sBSio03fAXOoBK3inSnSQ_gTXsEVGT';

    const ACTION_LABELS = {
      'customer.reply_sent': 'ส่งข้อความ',
      'customer.reply_uncertain': 'ส่งไม่ชัดเจน',
      'customer.reply_failed': 'ส่งไม่สำเร็จ',
      'customer.human_takeover': 'แอดมินรับช่วง',
      'customer.ai_paused': 'หยุด AI',
      'customer.ai_resumed': 'เปิด AI กลับ',
      'customer.ai_pause_cleared': 'ยกเลิกเวลาพัก AI',
    };

    const DELIVERY_LABEL = {
      accepted: 'LINE รับแล้ว',
      uncertain: 'LINE ไม่ยืนยันผล',
      rejected: 'LINE ปฏิเสธ',
      pending: 'กำลังส่ง',
      suppressed: 'ไม่ได้ส่ง',
    };

    const passcodeInput = document.getElementById('staffPasscode');
    const statusEl = document.getElementById('status');
    const tableWrap = document.getElementById('tableWrap');
    const filterInput = document.getElementById('filterInput');

    let allRecords = [];

    document.getElementById('clearPasscodeBtn').addEventListener('click', () => {
      passcodeInput.value = '';
      setStatus('ล้าง passcode แล้ว', 'success');
    });

    passcodeInput.addEventListener('change', () => {
      const value = passcodeInput.value.trim();
      if (value) loadHistory();
    });

    function requireStaffKey() {
      const staffKey = passcodeInput.value.trim();
      if (!staffKey) {
        setStatus('กรุณากรอก staff passcode ก่อน', 'error');
        passcodeInput.focus();
        return null;
      }
      return staffKey;
    }

    async function loadHistory() {
      const staffKey = requireStaffKey();
      if (!staffKey) return;

      setStatus('กำลังโหลด...', '');
      try {
        const res = await fetch(`${FUNCTION_URL}/audit-log`, {
          method: 'POST',
          headers: {
            'apikey': SUPA_KEY,
            'Authorization': `Bearer ${SUPA_KEY}`,
            'Content-Type': 'application/json',
            'x-staff-key': staffKey,
          },
          body: JSON.stringify({}),
        });
        if (res.status === 401) {
          passcodeInput.value = '';
          throw new Error('รหัสพนักงานไม่ถูกต้อง');
        }
        if (res.status === 429) {
          // The server blocks this IP for 15 minutes after repeated bad passcodes; drop the
          // cached key so staff cannot keep hammering the same rejected passcode.
          passcodeInput.value = '';
          const cooldown = new Error('ลองรหัสผิดหลายครั้ง ระบบพักการเข้าสู่ระบบ 15 นาที');
          cooldown.cooldown = true;
          throw cooldown;
        }
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.ok === false) throw new Error(json.error || `HTTP ${res.status}`);

        allRecords = json.records ?? [];
        setStatus(`โหลดแล้ว ${allRecords.length} รายการ`, 'success');
        applyFilter();
      } catch (error) {
        setStatus(
          error.cooldown ? error.message : `โหลดไม่สำเร็จ: ${error.message}`,
          'error',
        );
      }
    }

    function applyFilter() {
      const q = filterInput.value.trim().toLowerCase();
      const filtered = q
        ? allRecords.filter((r) =>
            (r.customerName || '').toLowerCase().includes(q) ||
            (ACTION_LABELS[r.action] || r.action || '').toLowerCase().includes(q)
          )
        : allRecords;
      render(filtered);
    }

    function formatThaiTime(value) {
      const date = new Date(value);
      if (!Number.isFinite(date.getTime())) return String(value);
      return date.toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });
    }

    // Audit writers only fill the fields they know about (some record `after`, some only
    // `metadata`), so render whatever is present instead of hiding a real event behind "-".
    function describeValue(value) {
      if (value === null || value === undefined) return null;
      if (typeof value === 'string') return value.trim() ? value.slice(0, 160) : null;
      if (typeof value === 'number' || typeof value === 'boolean') return String(value);
      if (Array.isArray(value)) {
        const items = value.map(describeValue).filter(Boolean);
        return items.length ? items.join(', ') : null;
      }
      if (typeof value === 'object') {
        const items = Object.entries(value)
          .map(([key, item]) => {
            const text = describeValue(item);
            return text === null ? null : `${key}=${text}`;
          })
          .filter(Boolean);
        return items.length ? items.join(' · ') : null;
      }
      return null;
    }

    function detailOf(record) {
      const parts = [];
      if (record.after?.message) parts.push(String(record.after.message));
      if (record.after?.delivery) {
        parts.push(`ผลส่ง: ${DELIVERY_LABEL[record.after.delivery] || record.after.delivery}`);
      }
      if (record.after?.deliveryStatusSaved === false) {
        parts.push('บันทึกสถานะส่งไม่สำเร็จ');
      }
      if (record.after?.pausedUntil) {
        parts.push(`พักถึง ${formatThaiTime(record.after.pausedUntil)}`);
      } else if (
        (record.action === 'customer.ai_pause_cleared' || record.action === 'customer.ai_resumed') &&
        record.after && Object.hasOwn(record.after, 'pausedUntil')
      ) {
        parts.push('ล้างเวลาพักแล้ว');
      }
      if (parts.length === 0) {
        const metadata = describeValue(record.metadata);
        if (metadata) parts.push(metadata);
      }
      if (parts.length === 0) {
        const after = describeValue(record.after);
        if (after) parts.push(after);
      }
      if (parts.length === 0) {
        const before = describeValue(record.before);
        if (before) parts.push(`ก่อนหน้า: ${before}`);
      }
      return parts.length ? parts.join(' · ') : '-';
    }

    function render(records) {
      tableWrap.replaceChildren();
      if (records.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'muted';
        empty.textContent = 'ไม่มีรายการ';
        tableWrap.appendChild(empty);
        return;
      }

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>เวลา</th><th>การกระทำ</th><th>ลูกค้า</th><th>โดย</th><th>รายละเอียด</th></tr>';
      const tbody = document.createElement('tbody');

      records.forEach((r) => {
        const tr = document.createElement('tr');

        const time = document.createElement('td');
        time.textContent = new Date(r.timestamp).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' });

        const action = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = ACTION_LABELS[r.action] || r.action;
        action.appendChild(badge);

        const customer = document.createElement('td');
        customer.textContent = r.customerName || r.entity?.id || '-';

        const actor = document.createElement('td');
        actor.textContent = r.actor?.id || (r.actor?.type === 'staff' ? 'staff (ไม่ระบุตัวตน)' : r.actor?.type || '-');

        const detail = document.createElement('td');
        detail.textContent = detailOf(r);

        tr.append(time, action, customer, actor, detail);
        tbody.appendChild(tr);
      });

      table.append(thead, tbody);
      tableWrap.appendChild(table);
    }

    function setStatus(message, type) {
      statusEl.hidden = false;
      statusEl.className = `status${type ? ` ${type}` : ''}`;
      statusEl.textContent = message;
    }

    filterInput.addEventListener('input', applyFilter);
    document.getElementById('reloadBtn').addEventListener('click', loadHistory);
    if (passcodeInput.value.trim()) loadHistory();
  </script>
</body>
</html>
