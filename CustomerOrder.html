<script>
const SUPA_URL = "https://zzsgnqlhrksvqkidienm.supabase.co";
const SUPA_KEY = "YOUR_SUPABASE_KEY";

function fmtDate(d){
  if(!d) return "-";
  const dt = new Date(d);
  return dt.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'});
}

let S = {
  step:1,
  orderId:null,
  startDate:null,
  dueDate:null,
  copied:false,
  loading:false,
  error:null,
  submitted:false,
  name:"",
  contact:"",
  channel:"",
  brand:"",
  model:"",
  selected:{},
  otherText:"",
  colorText:"",
  paymentType:""
};

function selLabels(){
  return Object.keys(S.selected)
    .filter(k=>S.selected[k])
    .map(k=>k==="other"?`อื่นๆ (${S.otherText})`:k);
}

function totalUnits(){
  return Object.values(S.selected).filter(Boolean).length;
}

async function submitOrder(){
  S.loading=true;
  render();
  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/orders`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPA_KEY,
        'Authorization':`Bearer ${SUPA_KEY}`,
        'Prefer':'return=representation'
      },
      body:JSON.stringify({
        customer_name:S.name,
        contact:S.contact,
        channel:S.channel,
        brand:S.brand,
        model:S.model,
        items:selLabels(),
        color:S.colorText,
        unit:totalUnits(),
        payment_type:S.paymentType,
        status:'pending',
        priority:'normal'
      })
    });

    if(!res.ok){
      const err=await res.json();
      throw new Error(err.message||'Insert failed');
    }

    const data=await res.json();
    const row = Array.isArray(data)?data[0]:data;

    S.orderId=row?.order_id||'—';
    S.startDate=row?.start_date||null;
    S.dueDate=row?.due_date||null;
    S.submitted=true;
    S.loading=false;
    render();

  }catch(err){
    S.error=err.message;
    S.loading=false;
    render();
  }
}

function renderSuccess(){
  const labels=selLabels();

  const msg=`📋 ยืนยันออเดอร์ KMO Rackbar Custom

Order ID: ${S.orderId}
ชื่อ: ${S.name}
ติดต่อ: ${S.contact}
รถ: ${S.brand} ${S.model}
รายการ: ${labels.join(", ")}
จำนวน: ${totalUnits()} units

🛠 เริ่มผลิต: ${fmtDate(S.startDate)}
📦 กำหนดส่งโดยประมาณ: ${fmtDate(S.dueDate)}

การชำระ: ${
  S.paymentType==="deposit500"?"มัดจำ 500 บาท":
  S.paymentType==="deposit1000"?"มัดจำ 1,000 บาท":
  "เต็มจำนวน"
}

📎 (แนบสลิปในข้อความนี้ด้วยนะครับ)`;

  return `
  <div style="padding:32px 24px">
    <h2 style="color:#fff">สั่งออเดอร์สำเร็จ!</h2>

    <div style="background:#0f172a;border-radius:12px;padding:16px;margin-top:16px">
      <div style="font-size:12px;color:#94a3b8;margin-bottom:8px">ข้อความสำหรับส่ง LINE</div>
      <pre style="white-space:pre-wrap;color:#e2e8f0">${msg}</pre>
      <button onclick="navigator.clipboard.writeText(\`${msg}\`)">คัดลอก</button>
    </div>
  </div>`;
}

function render(){
  const app=document.getElementById('app');
  if(S.submitted){
    app.innerHTML=renderSuccess();
    return;
  }

  app.innerHTML=`
  <div style="padding:24px">
    <h2>Demo Submit</h2>
    <button onclick="submitOrder()">ยืนยันออเดอร์</button>
  </div>`;
}

render();
</script>
