<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KMO Order</title>
<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0f172a;
  color:white;
}
button{
  padding:10px 16px;
  border-radius:8px;
  border:none;
  cursor:pointer;
}
.primary{
  background:#22c55e;
  color:white;
}
.box{
  background:#1e293b;
  padding:20px;
  border-radius:14px;
  margin-top:20px;
}
textarea{
  width:100%;
  height:220px;
  background:#0f172a;
  color:#e2e8f0;
  border-radius:10px;
  padding:12px;
  border:1px solid #334155;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const SUPA_URL = "https://zzsgnqlhrksvqkidienm.supabase.co";
const SUPA_KEY = "sb_publishable_KRXKFWO5EHt1zpQ0wJWmTw_G2uShXEx"; // 🔥 เปลี่ยนตรงนี้

function fmtDate(d){
  if(!d) return "-";
  const dt = new Date(d);
  return dt.toLocaleDateString('th-TH',{
    day:'numeric',
    month:'short',
    year:'2-digit'
  });
}

let S = {
  name:"เทส ลูกค้า",
  contact:"0800000000",
  brand:"Honda",
  model:"ADV350",
  selected:{ rack:true },
  paymentType:"deposit1000",
  submitted:false,
  orderId:null,
  startDate:null,
  dueDate:null,
  loading:false,
  error:null
};

function totalUnits(){
  return Object.values(S.selected).filter(Boolean).length;
}

function selLabels(){
  return Object.keys(S.selected)
    .filter(k=>S.selected[k]);
}

async function submitOrder(){
  S.loading=true;
  render();

  try{
    const res = await fetch(`${SUPA_URL}/rest/v1/orders`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPA_KEY,
        'Authorization':`Bearer ${SUPA_KEY}`,
        'Prefer':'return=representation'
      },
      body:JSON.stringify({
        customer_name:S.name,
        contact:S.contact,
        brand:S.brand,
        model:S.model,
        items:selLabels(),
        unit:totalUnits(),
        payment_type:S.paymentType,
        status:'pending',
        priority:'normal'
      })
    });

    if(!res.ok){
      const err=await res.text();
      throw new Error(err);
    }

    const data=await res.json();
    const row = Array.isArray(data)?data[0]:data;

    S.orderId=row.order_id;
    S.startDate=row.start_date;
    S.dueDate=row.due_date;
    S.submitted=true;
    S.loading=false;
    render();

  }catch(err){
    S.error=err.message;
    S.loading=false;
    render();
  }
}

function renderSuccess(){
  const labels=selLabels();

  const msg =
`📋 ยืนยันออเดอร์ KMO Rackbar Custom

Order ID: ${S.orderId}
ชื่อ: ${S.name}
ติดต่อ: ${S.contact}
รถ: ${S.brand} ${S.model}
รายการ: ${labels.join(", ")}
จำนวน: ${totalUnits()} units

🛠 เริ่มผลิต: ${fmtDate(S.startDate)}
📦 กำหนดส่งโดยประมาณ: ${fmtDate(S.dueDate)}

การชำระ: ${
  S.paymentType==="deposit500"?"มัดจำ 500 บาท":
  S.paymentType==="deposit1000"?"มัดจำ 1,000 บาท":
  "เต็มจำนวน"
}

📎 (แนบสลิปในข้อความนี้ด้วยนะครับ)`;

  return `
  <div style="padding:30px">
    <h2>สั่งออเดอร์สำเร็จ!</h2>

    <div class="box">
      <div style="margin-bottom:10px;color:#94a3b8">
        ข้อความสำหรับส่ง LINE
      </div>

      <textarea readonly>${msg}</textarea>

      <br><br>
      <button onclick="navigator.clipboard.writeText(\`${msg}\`)">
        คัดลอกข้อความ
      </button>

      <br><br>
      <a href="https://line.me/R/msg/text/?${encodeURIComponent(msg)}" target="_blank">
        <button class="primary">ส่งสลิปผ่าน LINE</button>
      </a>
    </div>
  </div>
  `;
}

function renderForm(){
  return `
  <div style="padding:30px">
    <h2>Demo Submit Order</h2>

    <button class="primary" onclick="submitOrder()">
      ${S.loading?"กำลังบันทึก...":"ยืนยันออเดอร์"}
    </button>

    ${S.error?`<div style="color:red;margin-top:10px">${S.error}</div>`:""}
  </div>
  `;
}

function render(){
  const app=document.getElementById("app");
  if(!app) return;

  if(S.submitted){
    app.innerHTML=renderSuccess();
  }else{
    app.innerHTML=renderForm();
  }
}

render();
</script>

</body>
</html>
