<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KMO Rackbar Custom</title>
</head>
<body>
<div id="app"></div>

<script>
const SUPA_URL = "https://zzsgnqlhrksvqkidienm.supabase.co";
const SUPA_KEY = "PUT_YOUR_ANON_PUBLIC_KEY_HERE"; // ใส่ anon public key ตรงนี้

let S = {
  step:1,
  orderId:null,
  startDate:null,
  dueDate:null,
  submitted:false,
  loading:false,
  error:null,
  name:"",contact:"",channel:"",
  brand:"",model:"",
  items:[],color:"",
  payment:""
};

function genOrderId(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  const rand=Math.floor(Math.random()*9000+1000);
  return `KMO-${y}${m}${day}-${rand}`;
}

function addDays(days){
  const d=new Date();
  d.setDate(d.getDate()+days);
  return d.toISOString();
}

async function submitOrder(){
  S.loading=true;
  render();

  const orderId=genOrderId();
  const start=new Date().toISOString();
  const due=addDays(7);

  try{
    const res=await fetch(`${SUPA_URL}/rest/v1/orders`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPA_KEY,
        'Authorization':`Bearer ${SUPA_KEY}`,
        'Prefer':'return=representation'
      },
      body:JSON.stringify({
        order_id:orderId,
        customer_name:S.name,
        contact:S.contact,
        channel:S.channel,
        brand:S.brand,
        model:S.model,
        items:S.items,
        color:S.color,
        payment_type:S.payment,
        status:'pending',
        start_date:start,
        due_date:due
      })
    });

    if(!res.ok){
      const t=await res.text();
      throw new Error(t);
    }

    S.orderId=orderId;
    S.startDate=start;
    S.dueDate=due;
    S.submitted=true;
    S.loading=false;
    render();

  }catch(err){
    S.error="บันทึกไม่สำเร็จ ตรวจสอบ Key หรือ Table orders";
    S.loading=false;
    render();
  }
}

function render(){
  const app=document.getElementById('app');

  if(S.submitted){
    app.innerHTML=`
      <h2>สั่งสำเร็จ</h2>
      <pre>
Order ID: ${S.orderId}
เริ่มผลิต: ${new Date(S.startDate).toLocaleDateString()}
กำหนดส่ง: ${new Date(S.dueDate).toLocaleDateString()}
      </pre>
    `;
    return;
  }

  app.innerHTML=`
  <h2>KMO Order</h2>
  <input placeholder="ชื่อ" oninput="S.name=this.value">
  <input placeholder="ติดต่อ" oninput="S.contact=this.value">
  <input placeholder="ค่ายรถ" oninput="S.brand=this.value">
  <input placeholder="รุ่นรถ" oninput="S.model=this.value">
  <input placeholder="สี" oninput="S.color=this.value">
  <button onclick="submitOrder()" ${S.loading?'disabled':''}>
    ${S.loading?'กำลังบันทึก...':'ยืนยันออเดอร์'}
  </button>
  ${S.error?`<p style="color:red">${S.error}</p>`:''}
  `;
}

render();
</script>
</body>
</html>
