<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สั่งผลิตอุปกรณ์รถ — KMO Rackbar Custom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: radial-gradient(ellipse at 20% 40%, #1a0800 0%, #0a0f1a 55%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #e2e8f0; }
    input::placeholder { color: #2d3748; }
    button { cursor: pointer; font-family: inherit; }
    button:hover:not(:disabled) { opacity: .85; }
    button:disabled { cursor: not-allowed; }
    a { text-decoration: none; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    @keyframes popIn  { 0% { transform:scale(.8); opacity:0; } 100% { transform:scale(1); opacity:1; } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    .card { width: 100%; max-width: 420px; background: #1a2236; border-radius: 24px; border: 1px solid #2d3748; box-shadow: 0 40px 80px #00000090; }
    .card-header { padding: 28px 28px 0; }
    .card-body { padding: 0 28px 28px; }
    .label { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 8px; letter-spacing: .5px; }
    .label.mt { margin-top: 16px; }
    .inp { width: 100%; background: #0f172a; border: 1.5px solid #1e293b; border-radius: 10px; padding: 12px 14px; color: #fff; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; margin-bottom: 4px; transition: border .15s; }
    .inp:disabled { background: #0a0f1a; color: #4a5568; cursor: not-allowed; }
    .inp:focus { border-color: #f97316; }
    .btn-primary { background: #f97316; border: none; border-radius: 12px; padding: 13px 20px; color: #fff; font-size: 15px; font-weight: 700; transition: all .15s; flex: 1; }
    .btn-back { background: transparent; border: 1px solid #2d3748; border-radius: 12px; padding: 13px; color: #718096; font-size: 13px; font-weight: 700; width: 78px; flex-shrink: 0; }
    .anim { animation: fadeIn .25s ease; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .steps { display: flex; align-items: center; margin-bottom: 22px; }
    .sdot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; transition:all .3s; flex-shrink:0; border:2px solid #2d3748; background:transparent; color:#4a5568; }
    .sdot.active { border-color:#f97316; background:#fff; color:#f97316; }
    .sdot.done { border-color:#f97316; background:#f97316; color:#fff; }
    .sline { flex:1; height:2px; background:#1e293b; margin:0 4px; margin-bottom:14px; transition:background .3s; }
    .sline.done { background:#f97316; }
    .slabel { font-size:8px; font-weight:700; text-align:center; margin-top:3px; white-space:nowrap; color:#4a5568; }
    .slabel.on { color:#f97316; }
    .nav { display:flex; gap:10px; margin-top:14px; }
    .box { background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:14px; }
  </style>
</head>
<body>
<div class="card" id="app"></div>
<script>
const SUPA_URL = "https://xfhpwxjywqgqefbncumm.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmaHB3eGp5d3FncWVmYm5jdW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MjIxMTQsImV4cCI6MjA4ODM5ODExNH0.GRfJ8aY9FgfMw18Vld4m2R6mE2cOwUsJw3OXOJEt0is";
const BRANDS = ["Honda","Yamaha","Kawasaki","Suzuki","BMW","KTM","Ducati","Royal Enfield","Triumph","อื่นๆ"];
const PRODUCTS = [
  {id:"crash_bar",label:"แคชบาร์",emoji:"🛡️",unit:1,size:"งานใหญ่"},
  {id:"side_rack",label:"แร็คข้าง",emoji:"📦",unit:1,size:"งานใหญ่"},
  {id:"rear_rack",label:"แร็คท้าย",emoji:"🎒",unit:1,size:"งานใหญ่"},
  {id:"bar",label:"บาร์เสริม / ค้ำท้าย",emoji:"🔧",unit:0.5,size:"งานเล็ก"},
  {id:"other",label:"อื่นๆ",emoji:"✏️",unit:1,size:"งานใหญ่",freetext:true},
];
const CHANNELS = ["Line","Facebook","Instagram","มาเอง","อื่นๆ"];
const CH_ICONS = {Line:"💬",Facebook:"📘",Instagram:"📸","มาเอง":"🏍️","อื่นๆ":"📦"};
const STEP_LABELS = ["ติดต่อ","รถ","รายการ","ชำระ","ยืนยัน"];

let S = {step:1,orderId:null,copied:false,loading:false,error:null,submitted:false,name:"",contact:"",channel:"",brand:"",model:"",selected:{},otherText:"",colorText:"",paymentType:"",deliveryType:"",deliveryAddress:"",startDate:null,dueDate:null,prefillNoteText:"",cartMeta:null,estimatedTotal:null,sourcePage:null};

function set(patch){Object.assign(S,patch);render();}
// อัปเดต state โดยไม่ re-render (ใช้กับ freetext input เพื่อไม่ให้ focus หลุด)
function setQuiet(patch){
  Object.assign(S,patch);
  // อัปเดตแค่ปุ่ม Next
  const nb=document.getElementById('btn-next');
  if(nb){const ok=canNext();nb.disabled=!ok;nb.style.opacity=ok?'1':'.35';}
}

function totalUnits(){return PRODUCTS.reduce((s,p)=>S.selected[p.id]?s+p.unit:s,0);}
function selLabels(){
  const labels=PRODUCTS.filter(p=>S.selected[p.id]).map(p=>p.id==="other"?`อื่นๆ (${S.otherText})`:p.label);
  if(S.prefillNoteText&&!S.selected.other)labels.push(`โน้ตเพิ่มเติม (${S.prefillNoteText})`);
  return labels;
}
function canNext(){
  if(S.step===1)return S.name&&S.contact&&S.channel&&S.deliveryType&&(S.deliveryType==='pickup'||S.deliveryAddress.trim());
  if(S.step===2)return S.brand&&S.model;
  if(S.step===3)return totalUnits()>0&&(!S.selected.other||S.otherText.trim())&&S.colorText.trim();
  if(S.step===4)return!!S.paymentType;
  return true;
}
function e(s){if(!s&&s!==0)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function decodeCartMeta(value){
  if(!value)return null;
  try{
    const parsed=JSON.parse(decodeURIComponent(escape(atob(value))));
    if(!parsed||parsed.version!==1||!Array.isArray(parsed.items))return null;
    return parsed;
  }catch(err){return null;}
}

async function rpc(name, payload){
  const res=await fetch(`${SUPA_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':`Bearer ${SUPA_KEY}`},body:JSON.stringify(payload)});
  const text=await res.text();
  const data=text?JSON.parse(text):null;
  if(!res.ok)throw new Error(data?.message||data?.error||`${name} failed`);
  return data;
}

function lineBtn(){return`<a href="https://lin.ee/K8K85Bb" target="_blank" style="display:flex;align-items:center;justify-content:center;gap:8px;background:#06C755;border-radius:10px;padding:11px 16px;color:#fff;font-weight:700;font-size:14px" onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'"><svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.05 2 11.08c0 3.53 2.29 6.62 5.74 8.35-.25.93-.94 3.38-.97 3.57-.04.26.1.52.34.63.1.04.2.06.31.06.17 0 .33-.07.46-.18.2-.16 3.3-2.19 4.66-3.08.48.06.96.09 1.46.09 5.52 0 10-4.05 10-9.08C22 6.05 17.52 2 12 2z"/></svg>ส่งสลิปผ่าน LINE</a>`;}

function renderSteps(){
  let h='<div class="steps">';
  STEP_LABELS.forEach((lbl,i)=>{
    const n=i+1,done=S.step>n,active=S.step===n;
    h+=`<div style="display:flex;flex-direction:column;align-items:center;gap:3px"><div class="sdot ${done?'done':active?'active':''}">${done?'✓':n}</div><div class="slabel ${active||done?'on':''}">${lbl}</div></div>`;
    if(i<4)h+=`<div class="sline ${done?'done':''}"></div>`;
  });
  return h+'</div>';
}

function renderStep1(){
const delivOpts=[{id:'pickup',label:'ติดตั้งที่ร้าน',emoji:'🏍️'},{id:'delivery',label:'จัดส่งตามที่อยู่',emoji:'📦'}];
return`<div class="anim"><div class="label">ชื่อ / ชื่อร้าน</div><input class="inp" id="i-name" placeholder="เช่น คุณสมชาย" value="${e(S.name)}"><div class="label mt">เบอร์โทร หรือ LINE ID</div><input class="inp" id="i-contact" placeholder="เช่น 081-234-5678" value="${e(S.contact)}"><div class="label mt">ช่องทางที่ติดต่อ</div><div class="grid2">${CHANNELS.map(ch=>`<button class="ch-btn" data-v="${ch}" style="background:${S.channel===ch?'#f9731618':'#0f172a'};border:1.5px solid ${S.channel===ch?'#f97316':'#1e293b'};border-radius:10px;padding:11px 8px;color:${S.channel===ch?'#f97316':'#64748b'};font-size:13px;font-weight:600">${CH_ICONS[ch]} ${ch}</button>`).join('')}</div><div class="label mt">การรับสินค้า</div><div style="display:flex;flex-direction:column;gap:8px">${delivOpts.map(opt=>{const on=S.deliveryType===opt.id;return`<button class="del-btn" data-v="${opt.id}" style="width:100%;background:${on?'#f9731612':'#0f172a'};border:1.5px solid ${on?'#f97316':'#1e293b'};border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left"><span style="font-size:20px">${opt.emoji}</span><span style="font-size:14px;font-weight:600;color:${on?'#f97316':'#e2e8f0'};flex:1">${opt.label}</span><div style="width:22px;height:22px;border-radius:50%;background:${on?'#f97316':'transparent'};border:2px solid ${on?'#f97316':'#334155'};display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff">${on?'✓':''}</div></button>`;}).join('')}${S.deliveryType==='delivery'?`<input class="inp" id="i-address" placeholder="กรอกที่อยู่จัดส่ง..." value="${e(S.deliveryAddress)}" style="margin-top:4px">`:''}
</div></div>`;
}

function renderStep2(){return`<div class="anim"><div class="label">ค่ายรถ</div><div class="grid2" style="margin-bottom:16px">${BRANDS.map(b=>`<button class="brand-btn" data-v="${b}" style="background:${S.brand===b?'#f9731618':'#0f172a'};border:1.5px solid ${S.brand===b?'#f97316':'#1e293b'};border-radius:10px;padding:10px 8px;color:${S.brand===b?'#f97316':'#64748b'};font-size:13px;font-weight:600">${b}</button>`).join('')}</div><div class="label">รุ่นรถ</div><input class="inp" id="i-model" placeholder="${!S.brand?'เลือกค่ายก่อน':'ระบุรุ่นรถ เช่น ADV350'}" value="${e(S.model)}" ${!S.brand?'disabled':''}>${S.brand&&S.model?`<div style="background:#0f172a;border-radius:10px;padding:10px 14px;border:1px solid #f9731630;font-size:13px;color:#94a3b8;margin-top:4px">🏍️ <span style="color:#f97316;font-weight:600">${e(S.brand)} ${e(S.model)}</span></div>`:''}</div>`;}

function renderStep3(){const tu=totalUnits();return`<div class="anim"><div class="label">เลือกรายการ (เลือกได้หลายรายการ)</div><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px">${PRODUCTS.map(p=>{const on=S.selected[p.id];return`<div><button class="prod-btn" data-v="${p.id}" style="width:100%;background:${on?'#f9731612':'#0f172a'};border:1.5px solid ${on?'#f97316':'#1e293b'};border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px"><span style="font-size:20px">${p.emoji}</span><div style="flex:1;text-align:left"><div style="font-size:14px;font-weight:600;color:${on?'#f97316':'#e2e8f0'}">${p.label}</div><div style="font-size:11px;color:#64748b">${p.size} • ${p.unit} unit</div></div><div style="width:22px;height:22px;border-radius:50%;background:${on?'#f97316':'transparent'};border:2px solid ${on?'#f97316':'#334155'};display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff">${on?'✓':''}</div></button>${p.freetext&&on?`<input class="inp" id="i-other" placeholder="ระบุรายละเอียด..." value="${e(S.otherText)}" style="margin-top:6px">`:''}</div>`;}).join('')}</div>${tu>0?`<div style="background:#0f172a;border:1px solid #f9731440;border-radius:12px;padding:14px"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:#64748b">รวม units</span><span style="color:#f97316;font-weight:700">${tu} units</span></div></div>`:''}<div style="margin-top:12px"><div class="label">สี <span style="color:#ef4444">*</span></div><input class="inp" id="i-color" placeholder="เช่น ดำด้าน, เทาเมทัลลิก, Raw ไม่พ่นสี" value="${e(S.colorText)}"></div></div>`;}

function renderStep4(){return`<div class="anim"><div class="label">รูปแบบการชำระเงิน</div><div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">${[{id:'deposit500',label:'มัดจำ 500 บาท',desc:'ชำระส่วนที่เหลือเมื่อรับของ',emoji:'💳'},{id:'deposit1000',label:'มัดจำ 1,000 บาท',desc:'ชำระส่วนที่เหลือเมื่อรับของ',emoji:'💳'},{id:'full',label:'เต็มจำนวน',desc:'ชำระครบในครั้งเดียว',emoji:'✅'}].map(opt=>{const on=S.paymentType===opt.id;return`<button class="pay-btn" data-v="${opt.id}" style="background:${on?'#f9731612':'#0f172a'};border:1.5px solid ${on?'#f97316':'#1e293b'};border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;text-align:left"><span style="font-size:22px">${opt.emoji}</span><div style="flex:1"><div style="font-size:14px;font-weight:700;color:${on?'#f97316':'#e2e8f0'}">${opt.label}</div><div style="font-size:12px;color:#64748b;margin-top:2px">${opt.desc}</div></div><div style="width:22px;height:22px;border-radius:50%;background:${on?'#f97316':'transparent'};border:2px solid ${on?'#f97316':'#334155'};display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff">${on?'✓':''}</div></button>`;}).join('')}</div><div class="box" style="margin-bottom:12px"><div style="font-size:11px;color:#94a3b8;font-weight:700;margin-bottom:10px;text-align:center">📲 สแกน QR หรือโอนตามบัญชีด้านล่าง</div><img src="https://kmorackbarcustom.github.io/payment.jpg" style="width:100%;border-radius:10px;display:block" onerror="this.outerHTML='<div style=text-align:center;padding:18px;color:#475569;font-size:13px>⚠️ โหลดรูปไม่ได้ กรุณาติดต่อผ่าน LINE</div>'"></div><div class="box"><div style="font-size:12px;color:#94a3b8;margin-bottom:10px">หลังโอนแล้ว ส่งสลิปมาที่ LINE ครับ</div>${lineBtn()}</div></div>`;}

function renderStep5(){const delivLabel=S.deliveryType==="pickup"?"🏍️ ติดตั้งที่ร้าน":`📦 จัดส่ง: ${S.deliveryAddress}`;const rows=[["ชื่อ / ร้าน",S.name],["ติดต่อ",S.contact],["ช่องทาง",S.channel],["การรับ",delivLabel],["รถ",`${S.brand} ${S.model}`],["รายการ",selLabels().join(", ")],["สี",S.colorText],["รวม",`${totalUnits()} units`],["การชำระ",S.paymentType==="deposit500"?"มัดจำ 500 บาท":S.paymentType==="deposit1000"?"มัดจำ 1,000 บาท":"เต็มจำนวน"]];return`<div class="anim"><div class="box" style="margin-bottom:12px"><div style="font-size:10px;color:#64748b;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;font-weight:700">สรุปออเดอร์</div>${rows.map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1e293b;font-size:13px"><span style="color:#64748b">${k}</span><span style="color:#e2e8f0;font-weight:600;text-align:right;max-width:58%">${e(v)}</span></div>`).join('')}</div><div style="background:#0f172a;border:1px solid #06C75530;border-radius:12px;padding:12px;font-size:12px;color:#718096;margin-bottom:12px"><span style="color:#06C755;font-weight:700">📎 อย่าลืม!</span> ส่งสลิปพร้อม Order ID มาที่ LINE หลังกดยืนยันครับ</div>${S.error?`<div style="background:#ef444418;border:1px solid #ef444440;border-radius:10px;padding:10px 14px;font-size:12px;color:#ef4444;margin-bottom:12px">❌ ${e(S.error)}</div>`:''}</div>`;}

function renderSuccess(){const labels=selLabels();const delivLabel=S.deliveryType==="pickup"?"ติดตั้งที่ร้าน":`จัดส่ง: ${S.deliveryAddress}`;const payLabel=S.paymentType==="deposit500"?"มัดจำ 500 บาท":S.paymentType==="deposit1000"?"มัดจำ 1,000 บาท":"เต็มจำนวน";const fmt=d=>d?new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'รอยืนยัน';const msg=`📋 ยืนยันออเดอร์ KMO Rackbar Custom\n\nOrder ID: ${S.orderId}\nชื่อ: ${S.name}\nติดต่อ: ${S.contact}\nรถ: ${S.brand} ${S.model}\nรายการ: ${labels.join(", ")}\nสี: ${S.colorText}\nจำนวน: ${totalUnits()} units\nการรับ: ${delivLabel}\nการชำระ: ${payLabel}\n\n📎 (แนบสลิปในข้อความนี้ด้วยนะครับ)`;return`<div style="padding:32px 24px"><div style="text-align:center;margin-bottom:20px"><div style="font-size:48px;margin-bottom:8px;animation:popIn .4s ease">🏍️</div><h2 style="font-family:'Playfair Display',serif;font-size:22px;margin:0 0 4px;color:#fff">สั่งออเดอร์สำเร็จ!</h2><p style="color:#718096;font-size:13px">บันทึกลงระบบแล้วครับ</p></div>${S.startDate||S.dueDate?`<div style="background:#0f172a;border:1px solid #f9731430;border-radius:12px;padding:14px;margin-bottom:12px;display:flex;justify-content:space-around"><div style="text-align:center"><div style="font-size:10px;color:#64748b;font-weight:700;margin-bottom:4px">📅 คาดเริ่มผลิต</div><div style="font-size:14px;font-weight:700;color:#38bdf8">${fmt(S.startDate)}</div></div><div style="width:1px;background:#1e293b"></div><div style="text-align:center"><div style="font-size:10px;color:#64748b;font-weight:700;margin-bottom:4px">🎯 คาดเสร็จ</div><div style="font-size:14px;font-weight:700;color:#f97316">${fmt(S.dueDate)}</div></div></div>`:''}<div style="display:flex;gap:8px;margin-bottom:16px">${[["1","คัดลอกข้อความ"],["2","เปิด LINE"],["3","วาง + แนบสลิป"]].map(([n,l])=>`<div style="flex:1;background:#0f172a;border-radius:10px;padding:10px 8px;text-align:center"><div style="font-size:16px;font-weight:800;color:#f97316;font-family:'Playfair Display',serif">${n}</div><div style="font-size:10px;color:#64748b;margin-top:2px;font-weight:600">${l}</div></div>`).join('')}</div><div style="background:#0f172a;border:1px solid #f9731430;border-radius:14px;padding:16px;margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div style="font-size:11px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:1px">ข้อความสำหรับส่ง LINE</div><button id="btn-copy" style="background:${S.copied?'#16a34a':'#1e293b'};border:1px solid ${S.copied?'#16a34a':'#334155'};border-radius:7px;padding:5px 12px;color:${S.copied?'#fff':'#94a3b8'};font-size:11px;font-weight:700;transition:all .2s">${S.copied?'✓ คัดลอกแล้ว!':'📋 คัดลอก'}</button></div><div style="background:#070e1a;border-radius:10px;padding:12px 14px;font-size:12px;color:#94a3b8;line-height:1.8;white-space:pre-wrap;border:1px solid #1e293b;user-select:all">${e(msg)}</div></div>${lineBtn()}<div style="text-align:center;margin-top:14px"><button id="btn-new" style="background:none;border:none;color:#475569;font-size:12px">+ สั่งออเดอร์ใหม่</button></div></div>`;}

function renderForm(){const disabled=!canNext();const stepFn=[null,renderStep1,renderStep2,renderStep3,renderStep4,renderStep5][S.step];return`<div class="card-header"><div style="font-size:10px;color:#f97316;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">สั่งผลิตอุปกรณ์รถ</div><h1 style="font-family:'Playfair Display',serif;font-size:22px;margin:0 0 20px;color:#fff;line-height:1.3">กรอกข้อมูล<br>ออเดอร์ของคุณ</h1>${renderSteps()}</div><div class="card-body">${stepFn()}<div class="nav">${S.step>1?'<button class="btn-back" id="btn-back">← กลับ</button>':''}${S.step<5?`<button class="btn-primary" id="btn-next" ${disabled?'disabled':''} style="opacity:${disabled?.35:1}">ถัดไป →</button>`:`<button class="btn-primary" id="btn-submit" ${S.loading?'disabled':''} style="opacity:${S.loading?.7:1};display:flex;align-items:center;justify-content:center;gap:8px">${S.loading?'<div style="width:16px;height:16px;border:2px solid #ffffff50;border-top:2px solid #fff;border-radius:50%;animation:spin 1s linear infinite"></div> กำลังบันทึก...':'✓ ยืนยันออเดอร์'}</button>`}</div></div>`;}

function render(){const app=document.getElementById('app');app.innerHTML=S.submitted?renderSuccess():renderForm();bind();}

function bind(){
  const q=(id)=>document.getElementById(id);
  const on=(id,fn)=>{const el=q(id);if(el)el.addEventListener('input',fn);};
  on('i-name',ev=>setQuiet({name:ev.target.value}));
  on('i-contact',ev=>setQuiet({contact:ev.target.value}));
  on('i-model',ev=>setQuiet({model:ev.target.value}));
  on('i-other',ev=>setQuiet({otherText:ev.target.value}));
  on('i-color',ev=>setQuiet({colorText:ev.target.value}));
  on('i-address',ev=>setQuiet({deliveryAddress:ev.target.value}));
  document.querySelectorAll('.ch-btn').forEach(b=>b.addEventListener('click',()=>set({channel:b.dataset.v})));
  document.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click',()=>set({deliveryType:b.dataset.v,deliveryAddress:''})));
  document.querySelectorAll('.brand-btn').forEach(b=>b.addEventListener('click',()=>set({brand:b.dataset.v,model:''})));
  document.querySelectorAll('.prod-btn').forEach(b=>b.addEventListener('click',()=>{const sel={...S.selected,[b.dataset.v]:!S.selected[b.dataset.v]};set({selected:sel});}));
  document.querySelectorAll('.pay-btn').forEach(b=>b.addEventListener('click',()=>set({paymentType:b.dataset.v})));
  const nb=q('btn-next');if(nb)nb.addEventListener('click',()=>{if(canNext())set({step:S.step+1});});
  const bb=q('btn-back');if(bb)bb.addEventListener('click',()=>set({step:S.step-1}));
  const sb=q('btn-submit');if(sb)sb.addEventListener('click',async()=>{
    set({loading:true,error:null});
    try{
      const saved=await rpc('create_customer_order',{p_payload:{customer_name:S.name,contact:S.contact,channel:S.channel,brand:S.brand,model:S.model,items:selLabels(),color:S.colorText,unit:totalUnits(),payment_type:S.paymentType,delivery_type:S.deliveryType,delivery_address:S.deliveryType==='delivery'?S.deliveryAddress:null,cart_meta:S.cartMeta,estimated_total:S.estimatedTotal,source_page:S.sourcePage}});
      if(!saved?.order_id)throw new Error("บันทึกแล้วแต่ยังไม่ได้เลข Order ID กรุณาเปิด Dashboard ตรวจสอบก่อนส่ง LINE");
      set({orderId:saved.order_id,startDate:saved.start_date||null,dueDate:saved.due_date||null,submitted:true,loading:false});
    }catch(err){set({error:err.message||'เกิดข้อผิดพลาด กรุณาลองใหม่',loading:false});}
  });
  const cp=q('btn-copy');if(cp)cp.addEventListener('click',()=>{
    const labels=selLabels();
    const dLabel=S.deliveryType==="pickup"?"ติดตั้งที่ร้าน":`จัดส่ง: ${S.deliveryAddress}`;const pLabel=S.paymentType==="deposit500"?"มัดจำ 500 บาท":S.paymentType==="deposit1000"?"มัดจำ 1,000 บาท":"เต็มจำนวน";const msg=`📋 ยืนยันออเดอร์ KMO Rackbar Custom\n\nOrder ID: ${S.orderId}\nชื่อ: ${S.name}\nติดต่อ: ${S.contact}\nรถ: ${S.brand} ${S.model}\nรายการ: ${labels.join(", ")}\nสี: ${S.colorText}\nจำนวน: ${totalUnits()} units\nการรับ: ${dLabel}\nการชำระ: ${pLabel}\n\n📎 (แนบสลิปในข้อความนี้ด้วยนะครับ)`;
    navigator.clipboard.writeText(msg).then(()=>{set({copied:true});setTimeout(()=>set({copied:false}),2500);});
  });
  const nw=q('btn-new');if(nw)nw.addEventListener('click',()=>{S={step:1,orderId:null,copied:false,loading:false,error:null,submitted:false,name:'',contact:'',channel:'',brand:'',model:'',selected:{},otherText:'',colorText:'',paymentType:'',deliveryType:'',deliveryAddress:'',startDate:null,dueDate:null,prefillNoteText:'',cartMeta:null,estimatedTotal:null,sourcePage:null};render();});
}

function prefillFromQueryParams(){
  try{
    const params=new URLSearchParams(window.location.search);
    const products=params.get('products');
    const otherText=params.get('other_text');
    const cartMeta=decodeCartMeta(params.get('cart_meta'));
    if(cartMeta){
      S.cartMeta=cartMeta;
      S.estimatedTotal=Number.isFinite(Number(cartMeta.estimated_total))?Number(cartMeta.estimated_total):null;
      S.sourcePage=cartMeta.source_page||null;
    }
    if(products){
      const allowedIds=new Set(PRODUCTS.map(p=>p.id));
      products.split(',').map(id=>id.trim()).filter(id=>allowedIds.has(id)).forEach(id=>{S.selected[id]=true;});
    }
    if(otherText){
      if(S.selected.other)S.otherText=otherText;
      else S.prefillNoteText=otherText;
    }
  }catch(err){}
}

prefillFromQueryParams();
render();
</script>
</body>
</html>
