<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMO Staff LINE Reply</title>
  <style>
    :root {
      --bg: #101214;
      --panel: #181b1f;
      --border: #30343a;
      --text: #f5f5f5;
      --muted: #a8adb5;
      --accent: #ffcf07;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(700px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 56px;
    }

    h1, h2 {
      margin: 0 0 12px;
      line-height: 1.25;
    }

    .muted { color: var(--muted); }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0c0e10;
      color: var(--text);
      padding: 9px 10px;
      font: inherit;
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #050505;
      font-weight: 700;
      padding: 0 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .secondary-btn {
      background: #2a2f36;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .danger-btn {
      background: var(--danger);
      color: #fff;
    }

    .status {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0c0e10;
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: pre-wrap;
    }

    .status.error {
      border-color: var(--danger);
      color: #fecaca;
    }

    .status.success {
      border-color: var(--success);
      color: #bbf7d0;
    }

    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-top: 8px;
      cursor: pointer;
    }

    .result-row:hover {
      border-color: var(--accent);
    }

    .result-row.selected {
      border-color: var(--accent);
      background: #201d0a;
    }

    .badge {
      font-size: 12px;
      color: var(--danger);
    }
  </style>
</head>
<body>
  <main>
    <h1>KMO Staff LINE Reply</h1>
    <p class="muted">ค้นหาลูกค้า ส่งข้อความตอบผ่าน LINE โดยตรง — ระบบจะหยุด AI ตอบลูกค้าคนนั้นให้อัตโนมัติ 2 ชม.</p>

    <section class="panel">
      <div class="toolbar">
        <div>
          <h2>Staff passcode</h2>
          <p class="muted">รหัสเดียวกับหน้า admin อื่นๆ</p>
        </div>
        <button type="button" id="clearPasscodeBtn" class="secondary-btn">ล้าง passcode</button>
      </div>
      <label for="staffPasscode">รหัสพนักงาน</label>
      <input id="staffPasscode" type="password" autocomplete="current-password" placeholder="กรอกรหัสร้านก่อนใช้งาน">
    </section>

    <section class="panel">
      <div class="toolbar">
        <h2>รายชื่อลูกค้า (LINE)</h2>
        <button type="button" id="reloadBtn" class="secondary-btn">โหลดใหม่</button>
      </div>
      <input id="searchQuery" placeholder="พิมพ์เพื่อกรองรายชื่อ" autocomplete="off">
      <div id="searchStatus" class="status" hidden></div>
      <div id="searchResults"></div>
    </section>

    <section class="panel" id="replyPanel" hidden>
      <h2>ส่งข้อความถึง <span id="selectedName"></span></h2>
      <p class="muted" id="selectedPauseNote"></p>
      <textarea id="replyMessage" placeholder="พิมพ์ข้อความตอบลูกค้า"></textarea>
      <div class="button-row" style="margin-top: 10px;">
        <button type="button" id="sendBtn">ส่งข้อความ</button>
        <button type="button" id="resumeBtn" class="secondary-btn">เปิด AI กลับ (ไม่ส่งข้อความ)</button>
      </div>
      <div id="replyStatus" class="status" hidden></div>
    </section>
  </main>

  <script>
    const SUPA_URL = 'https://xfhpwxjywqgqefbncumm.supabase.co';
    const FUNCTION_URL = `${SUPA_URL}/functions/v1/staff-reply`;
    const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmaHB3eGp5d3FncWVmYm5jdW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MjIxMTQsImV4cCI6MjA4ODM5ODExNH0.GRfJ8aY9FgfMw18Vld4m2R6mE2cOwUsJw3OXOJEt0is';
    const PASSCODE_KEY = 'kmo_line_reply_staff_key';

    const passcodeInput = document.getElementById('staffPasscode');
    const searchQuery = document.getElementById('searchQuery');
    const searchStatus = document.getElementById('searchStatus');
    const searchResults = document.getElementById('searchResults');
    const replyPanel = document.getElementById('replyPanel');
    const selectedName = document.getElementById('selectedName');
    const selectedPauseNote = document.getElementById('selectedPauseNote');
    const replyMessage = document.getElementById('replyMessage');
    const replyStatus = document.getElementById('replyStatus');
    const sendBtn = document.getElementById('sendBtn');
    const resumeBtn = document.getElementById('resumeBtn');

    let selectedCustomer = null;
    let allCustomers = [];

    passcodeInput.value = sessionStorage.getItem(PASSCODE_KEY) || localStorage.getItem(PASSCODE_KEY) || '';

    document.getElementById('clearPasscodeBtn').addEventListener('click', () => {
      sessionStorage.removeItem(PASSCODE_KEY);
      localStorage.removeItem(PASSCODE_KEY);
      passcodeInput.value = '';
      setStatus(searchStatus, 'ล้าง passcode แล้ว', 'success');
    });

    passcodeInput.addEventListener('change', () => {
      const value = passcodeInput.value.trim();
      if (value) {
        sessionStorage.setItem(PASSCODE_KEY, value);
        localStorage.setItem(PASSCODE_KEY, value);
        loadCustomers();
      }
    });

    function requireStaffKey(statusEl) {
      const staffKey = passcodeInput.value.trim();
      if (!staffKey) {
        setStatus(statusEl, 'กรุณากรอก staff passcode ก่อน', 'error');
        passcodeInput.focus();
        return null;
      }
      return staffKey;
    }

    async function callFunction(action, payload, staffKey) {
      const res = await fetch(`${FUNCTION_URL}/${action}`, {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${SUPA_KEY}`,
          'Content-Type': 'application/json',
          'x-staff-key': staffKey,
        },
        body: JSON.stringify(payload),
      });
      const json = await res.json().catch(() => ({}));
      if (res.status === 401) {
        sessionStorage.removeItem(PASSCODE_KEY);
        localStorage.removeItem(PASSCODE_KEY);
        throw new Error('รหัสพนักงานไม่ถูกต้อง');
      }
      if (!res.ok || json.ok === false) throw new Error(json.error || `HTTP ${res.status}`);
      return json;
    }

    async function loadCustomers() {
      const staffKey = requireStaffKey(searchStatus);
      if (!staffKey) return;

      setStatus(searchStatus, 'กำลังโหลด...', '');
      try {
        const { matches } = await callFunction('list', {}, staffKey);
        allCustomers = matches;
        setStatus(searchStatus, `โหลดรายชื่อแล้ว ${matches.length} คน`, 'success');
        applyFilter();
      } catch (error) {
        setStatus(searchStatus, `โหลดไม่สำเร็จ: ${error.message}`, 'error');
      }
    }

    function applyFilter() {
      const q = searchQuery.value.trim().toLowerCase();
      const filtered = q
        ? allCustomers.filter((c) => (c.name || '').toLowerCase().includes(q) || (c.phone || '').includes(q))
        : allCustomers;
      renderResults(filtered);
    }

    searchQuery.addEventListener('input', applyFilter);
    document.getElementById('reloadBtn').addEventListener('click', loadCustomers);
    if (passcodeInput.value.trim()) loadCustomers();

    function renderResults(matches) {
      searchResults.replaceChildren();
      if (matches.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'muted';
        empty.textContent = 'ไม่มีรายชื่อที่ตรงกับคำกรอง';
        searchResults.appendChild(empty);
        return;
      }
      for (const customer of matches) {
        const row = document.createElement('div');
        row.className = 'result-row';
        const isPaused = customer.paused_until && new Date(customer.paused_until).getTime() > Date.now();

        const label = document.createElement('div');
        label.textContent = `${customer.name || '-'} ${customer.phone ? `(${customer.phone})` : ''}`;

        row.appendChild(label);
        if (isPaused) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = `⏸ หยุดถึง ${new Date(customer.paused_until).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' })}`;
          row.appendChild(badge);
        }

        row.addEventListener('click', () => selectCustomer(customer, row));
        searchResults.appendChild(row);
      }
    }

    function selectCustomer(customer, row) {
      selectedCustomer = customer;
      [...searchResults.children].forEach((el) => el.classList.remove('selected'));
      row.classList.add('selected');

      selectedName.textContent = customer.name || '-';
      const isPaused = customer.paused_until && new Date(customer.paused_until).getTime() > Date.now();
      selectedPauseNote.textContent = isPaused
        ? `AI หยุดตอบคนนี้อยู่ถึง ${new Date(customer.paused_until).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' })}`
        : 'AI กำลังตอบคนนี้ตามปกติ';

      replyMessage.value = '';
      replyStatus.hidden = true;
      replyPanel.hidden = false;
      replyMessage.focus();
    }

    sendBtn.addEventListener('click', async () => {
      const staffKey = requireStaffKey(replyStatus);
      if (!staffKey || !selectedCustomer) return;
      const message = replyMessage.value.trim();
      if (!message) {
        setStatus(replyStatus, 'พิมพ์ข้อความก่อนส่ง', 'error');
        return;
      }

      sendBtn.disabled = true;
      resumeBtn.disabled = true;
      setStatus(replyStatus, 'กำลังส่ง...', '');
      try {
        const result = await callFunction('send', { customerId: selectedCustomer.id, message }, staffKey);
        setStatus(replyStatus, `ส่งแล้ว — หยุด AI ถึง ${new Date(result.pausedUntil).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' })}`, 'success');
        replyMessage.value = '';
      } catch (error) {
        setStatus(replyStatus, `ส่งไม่สำเร็จ: ${error.message}`, 'error');
      } finally {
        sendBtn.disabled = false;
        resumeBtn.disabled = false;
      }
    });

    resumeBtn.addEventListener('click', async () => {
      const staffKey = requireStaffKey(replyStatus);
      if (!staffKey || !selectedCustomer) return;

      sendBtn.disabled = true;
      resumeBtn.disabled = true;
      setStatus(replyStatus, 'กำลังเปิด AI กลับ...', '');
      try {
        await callFunction('resume', { customerId: selectedCustomer.id }, staffKey);
        setStatus(replyStatus, 'เปิด AI ตอบคนนี้กลับมาแล้ว', 'success');
        selectedPauseNote.textContent = 'AI กำลังตอบคนนี้ตามปกติ';
      } catch (error) {
        setStatus(replyStatus, `เปิดกลับไม่สำเร็จ: ${error.message}`, 'error');
      } finally {
        sendBtn.disabled = false;
        resumeBtn.disabled = false;
      }
    });

    function setStatus(el, message, type) {
      el.hidden = false;
      el.className = `status${type ? ` ${type}` : ''}`;
      el.textContent = message;
    }
  </script>
</body>
</html>
