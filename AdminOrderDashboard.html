<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — KMO Rackbar Custom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #070e1a; color: #e2e8f0; }
    input::placeholder { color: #2a3a4a; }
    input { font-family: 'DM Sans', sans-serif; }
    button { font-family: 'DM Sans', sans-serif; cursor: pointer; }
    button:hover:not(:disabled) { opacity: .85; }
    button:disabled { cursor: not-allowed; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0a1220; }
    ::-webkit-scrollbar-thumb { background: #1e2d3d; border-radius: 2px; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useCallback } = React;

// ── SUPABASE CONFIG ───────────────────────────────────────────
const SUPABASE_URL = "https://zzsgnqlhrksvqkidienm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp6c2ducWxocmtzdnFraWRpZW5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3OTI4OTcsImV4cCI6MjA4NzM2ODg5N30.8gDNco7fcZHCU42XtNKmMcS4wzXnV3ltXUn8nqtfadA";

const headers = {
  "apikey": SUPABASE_ANON_KEY,
  "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
  "Content-Type": "application/json",
  "Prefer": "return=representation",
};

// ── API HELPERS ───────────────────────────────────────────────
async function fetchOrders() {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/orders?select=*&order=priority.asc,created_at.asc`,
    { headers }
  );
  if (!res.ok) throw new Error("โหลดข้อมูลไม่ได้");
  return res.json();
}

async function updateOrder(id, patch) {
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/orders?id=eq.${id}`,
    { method: "PATCH", headers, body: JSON.stringify(patch) }
  );
  if (!res.ok) throw new Error("อัปเดตไม่สำเร็จ");
}

async function rpcMatchAndLink(lineUid, orderId, name, contact) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/match_and_link_uid`, {
    method: "POST",
    headers,
    body: JSON.stringify({
      p_line_uid: lineUid,
      p_order_id: orderId || null,
      p_name: name || null,
      p_contact: contact || null,
    }),
  });
  if (!res.ok) throw new Error("match ไม่สำเร็จ");
  return res.json();
}

// ── CONSTANTS ─────────────────────────────────────────────────
const STATUS_CONFIG = {
  pending:     { label: "รอดำเนินการ", color: "#f59e0b", bg: "#f59e0b18" },
  in_progress: { label: "กำลังผลิต",   color: "#3b82f6", bg: "#3b82f618" },
  done:        { label: "เสร็จแล้ว",   color: "#22c55e", bg: "#22c55e18" },
  cancelled:   { label: "ยกเลิก",      color: "#ef4444", bg: "#ef444418" },
};

const TABS = ["ทั้งหมด", "รอดำเนินการ", "กำลังผลิต", "เสร็จแล้ว", "UID Matching"];

const fmt = (d) => d ? new Date(d).toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" }) : "—";
const fmtTime = (d) => d ? new Date(d).toLocaleString("th-TH", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";

// ── BADGE ─────────────────────────────────────────────────────
function Badge({ status }) {
  const c = STATUS_CONFIG[status] || STATUS_CONFIG.pending;
  return React.createElement("span", {
    style: { background: c.bg, color: c.color, border: `1px solid ${c.color}50`, borderRadius: 6, padding: "3px 9px", fontSize: 11, fontWeight: 700 }
  }, c.label);
}

// ── STAT CARD ─────────────────────────────────────────────────
function StatCard({ label, value, sub, color }) {
  return React.createElement("div", {
    style: { background: "#151f2e", border: "1px solid #1e2d3d", borderRadius: 14, padding: "16px 20px", flex: 1, minWidth: 100 }
  },
    React.createElement("div", { style: { fontSize: 10, color: "#4a6080", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 } }, label),
    React.createElement("div", { style: { fontSize: 26, fontWeight: 800, color: color || "#e2e8f0", fontFamily: "'Syne', sans-serif", lineHeight: 1 } }, value),
    sub && React.createElement("div", { style: { fontSize: 10, color: "#4a6080", marginTop: 4 } }, sub)
  );
}

// ── ORDER CARD ────────────────────────────────────────────────
function OrderCard({ order, onStatusChange, onShopeeOverride, onRefresh }) {
  const [expanded, setExpanded] = useState(false);
  const [editDeadline, setEditDeadline] = useState(false);
  const [shopeeDate, setShopeeDate] = useState(order.shopee_deadline || "");
  const [saving, setSaving] = useState(false);

const handleStatus = async (newStatus) => {
  setSaving(true);
  try {
    await updateOrder(order.id, { status: newStatus });
    await onRefresh(); // โหลดข้อมูลใหม่จาก Supabase
  } catch (e) {
    alert(e.message);
  } finally {
    setSaving(false);
  }
};

  const handleShopeeDeadline = async () => {
    setSaving(true);
    try {
      await updateOrder(order.id, { shopee_deadline: shopeeDate, priority: "shopee" });
      onShopeeOverride(order.id, shopeeDate);
      setEditDeadline(false);
    } catch (e) { alert(e.message); }
    finally { setSaving(false); }
  };

  const items = Array.isArray(order.items) ? order.items : [];
  const e = React.createElement;

  return e("div", {
    style: {
      background: "#0d1929",
      border: `1px solid ${order.priority === "shopee" ? "#f9731430" : "#1e2d3d"}`,
      borderLeft: `3px solid ${order.priority === "shopee" ? "#f97316" : STATUS_CONFIG[order.status]?.color || "#334155"}`,
      borderRadius: 12, marginBottom: 8, overflow: "hidden",
    }
  },
    // Row
    e("div", {
      onClick: () => setExpanded(v => !v),
      style: { display: "flex", alignItems: "center", gap: 12, padding: "12px 16px", cursor: "pointer" }
    },
      e("div", { style: { minWidth: 140 } },
        order.priority === "shopee" && e("div", { style: { fontSize: 9, color: "#f97316", fontWeight: 800, letterSpacing: 1, textTransform: "uppercase", marginBottom: 2 } }, "🛒 SHOPEE"),
        e("div", { style: { fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, color: "#f97316", fontWeight: 600 } },
          order.order_id || order.id?.slice(0, 8)
        )
      ),
      e("div", { style: { flex: 1, minWidth: 0 } },
        e("div", { style: { fontSize: 13, fontWeight: 700, color: "#e2e8f0", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } }, order.customer_name || "—"),
        e("div", { style: { fontSize: 11, color: "#4a6080" } }, `${order.brand || ""} ${order.model || ""}`.trim() || "—")
      ),
      e("div", { style: { textAlign: "center", minWidth: 44 } },
        e("div", { style: { fontSize: 16, fontWeight: 800, color: "#e2e8f0" } }, order.unit),
        e("div", { style: { fontSize: 10, color: "#4a6080" } }, "units")
      ),
      e("div", { style: { textAlign: "center", minWidth: 90 } },

  // start_date
  order.start_date && e("div", {
    style: { fontSize: 11, color: "#38bdf8", marginBottom: 2 }
  }, "เริ่มผลิต " + fmt(order.start_date)),

  // due_date
  e("div", { 
    style: { 
      fontSize: 12, 
      fontWeight: 600, 
      color: order.status === "done" ? "#22c55e" : "#94a3b8" 
    } 
  }, fmt(order.due_date)),

  e("div", { style: { fontSize: 10, color: "#4a6080" } }, "กำหนดส่ง")
),
      e("div", { style: { minWidth: 28, textAlign: "center" } },
        e("span", { title: order.line_user_id || "ยังไม่ผูก UID", style: { fontSize: 14 } },
          order.line_user_id ? "🟢" : "⚪"
        )
      ),
      e(Badge, { status: order.status }),
      e("span", { style: { color: "#4a6080", fontSize: 12 } }, expanded ? "▲" : "▼")
    ),

    // Expanded
    expanded && e("div", {
      style: { borderTop: "1px solid #1e2d3d", padding: "14px 16px", background: "#0a1220", animation: "fadeIn .2s ease" }
    },
      e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 14 } },
        [
          ["ติดต่อ", order.contact],
          ["ช่องทาง", order.channel],
          ["การชำระ", order.payment_type === "half" ? "มัดจำ 50%" : order.payment_type === "full" ? "เต็มจำนวน" : "—"],
          ["รายการ", items.join(", ") || "—"],
          ["เริ่มผลิต", fmt(order.start_date)],
          ["สร้างเมื่อ", fmtTime(order.created_at)],
          ["LINE UID", order.line_user_id || "ยังไม่ผูก"],
          ["ผูกเมื่อ", fmtTime(order.line_linked_at)],
          ["Shopee Order", order.shopee_order_id || "—"],
        ].map(([k, v]) =>
          e("div", { key: k, style: { background: "#151f2e", borderRadius: 8, padding: "8px 10px" } },
            e("div", { style: { fontSize: 9, color: "#4a6080", fontWeight: 700, textTransform: "uppercase", letterSpacing: .5, marginBottom: 2 } }, k),
            e("div", { style: { fontSize: 11, color: k === "LINE UID" && !order.line_user_id ? "#ef4444" : "#94a3b8", wordBreak: "break-all" } }, v || "—")
          )
        )
      ),

      // Shopee deadline
      order.channel === "Shopee" && e("div", {
        style: { background: "#f9731410", border: "1px solid #f9731430", borderRadius: 10, padding: "10px 14px", marginBottom: 10 }
      },
        e("div", { style: { fontSize: 11, color: "#f97316", fontWeight: 700, marginBottom: 6 } }, "🛒 Shopee Deadline"),
        editDeadline
          ? e("div", { style: { display: "flex", gap: 8 } },
              e("input", { type: "date", value: shopeeDate, onChange: ev => setShopeeDate(ev.target.value),
                style: { flex: 1, background: "#0a1220", border: "1px solid #f9731440", borderRadius: 6, padding: "6px 10px", color: "#e2e8f0", fontSize: 12, outline: "none" } }),
              e("button", { onClick: handleShopeeDeadline, disabled: saving,
                style: { background: "#f97316", border: "none", borderRadius: 6, padding: "6px 12px", color: "#fff", fontSize: 12, fontWeight: 700 } },
                saving ? "..." : "บันทึก"),
              e("button", { onClick: () => setEditDeadline(false),
                style: { background: "transparent", border: "1px solid #334155", borderRadius: 6, padding: "6px 12px", color: "#64748b", fontSize: 12 } },
                "ยกเลิก")
            )
          : e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } },
              e("span", { style: { fontSize: 12, color: "#e2e8f0" } },
                "กำหนดส่ง: ",
                e("strong", null, order.shopee_deadline ? fmt(order.shopee_deadline) : "ยังไม่ได้กำหนด")
              ),
              e("button", { onClick: () => setEditDeadline(true),
                style: { background: "transparent", border: "1px solid #f9731440", borderRadius: 6, padding: "4px 10px", color: "#f97316", fontSize: 11 } },
                order.shopee_deadline ? "แก้ไข" : "กำหนด")
            )
      ),

      // Status buttons
      e("div", { style: { display: "flex", gap: 8, flexWrap: "wrap" } },
        e("span", { style: { fontSize: 11, color: "#4a6080", alignSelf: "center", fontWeight: 700 } }, "เปลี่ยนสถานะ:"),
        ...Object.entries(STATUS_CONFIG).map(([key, cfg]) =>
          e("button", {
            key,
            onClick: () => handleStatus(key),
            disabled: order.status === key || saving,
            style: {
              background: order.status === key ? cfg.bg : "transparent",
              border: `1px solid ${order.status === key ? cfg.color : "#334155"}`,
              color: order.status === key ? cfg.color : "#64748b",
              borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 600,
              opacity: saving ? .5 : 1,
            }
          }, cfg.label)
        )
      )
    )
  );
}

// ── UID MATCH PANEL ───────────────────────────────────────────
function UidMatchPanel({ orders, onRefresh }) {
  const [lineUid, setLineUid] = useState("");
  const [orderId, setOrderId] = useState("");
  const [name, setName] = useState("");
  const [contact, setContact] = useState("");
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const e = React.createElement;

  const unlinked = orders.filter(o => !o.line_user_id && o.status !== "done");

  const runMatch = async () => {
    if (!lineUid.trim()) { alert("กรุณากรอก LINE UID ก่อนครับ"); return; }
    if (!orderId && !name && !contact) { alert("กรุณากรอกอย่างน้อย 1 อย่าง"); return; }
    setLoading(true); setResult(null);
    try {
      const res = await rpcMatchAndLink(lineUid, orderId, name, contact);
      const r = Array.isArray(res) ? res[0] : res;
      setResult(r);
      if (r?.matched) onRefresh();
    } catch (err) {
      setResult({ matched: false, message: err.message });
    } finally { setLoading(false); }
  };

  const quickLink = (order) => {
    setOrderId(order.order_id || "");
    setName(order.customer_name || "");
    setContact(order.contact || "");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const inputStyle = { width: "100%", background: "#0a1220", border: "1px solid #1e2d3d", borderRadius: 8, padding: "10px 14px", color: "#e2e8f0", fontSize: 12, outline: "none" };

  return e("div", { style: { display: "flex", flexDirection: "column", gap: 16 } },
    e("div", { style: { background: "#0d1929", border: "1px solid #1e2d3d", borderRadius: 14, padding: 20 } },
      e("div", { style: { fontSize: 13, fontWeight: 700, color: "#94a3b8", marginBottom: 16 } }, "🔗 ผูก LINE UID กับออเดอร์"),
      e("div", { style: { marginBottom: 12 } },
        e("div", { style: { fontSize: 11, color: "#4a6080", fontWeight: 700, marginBottom: 6, textTransform: "uppercase" } }, "LINE UID (จำเป็น)"),
        e("input", { value: lineUid, onChange: ev => setLineUid(ev.target.value), placeholder: "เช่น Uabc123def456...", style: { ...inputStyle, fontFamily: "'IBM Plex Mono', monospace" } })
      ),
      e("div", { style: { fontSize: 11, color: "#4a6080", fontWeight: 700, marginBottom: 8, textTransform: "uppercase" } }, "ค้นหาด้วย (อย่างน้อย 1 อย่าง)"),
      e("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginBottom: 14 } },
        [["Order ID", orderId, setOrderId, "ORD-20260228-X9F2"], ["ชื่อลูกค้า", name, setName, "เช่น สมชาย"], ["เบอร์ / LINE ID", contact, setContact, "เช่น 081-234-5678"]].map(([label, val, setter, ph]) =>
          e("div", { key: label },
            e("div", { style: { fontSize: 10, color: "#4a6080", marginBottom: 4 } }, label),
            e("input", { value: val, onChange: ev => setter(ev.target.value), placeholder: ph, style: inputStyle })
          )
        )
      ),
      e("button", { onClick: runMatch, disabled: loading,
        style: { background: "#f97316", border: "none", borderRadius: 8, padding: "10px 20px", color: "#fff", fontWeight: 700, fontSize: 13, opacity: loading ? .7 : 1 } },
        loading ? "กำลังค้นหา..." : "🔗 ผูก UID"
      ),
      result && e("div", {
        style: { marginTop: 12, background: result.matched ? "#22c55e18" : "#ef444418", border: `1px solid ${result.matched ? "#22c55e40" : "#ef444440"}`, borderRadius: 10, padding: "10px 14px", fontSize: 13, color: result.matched ? "#22c55e" : "#ef4444", fontWeight: 600, animation: "fadeIn .2s ease" }
      }, result.matched ? `✓ ${result.message} — Order: ${result.order_ref}` : `❌ ${result.message}`)
    ),
    e("div", { style: { background: "#0d1929", border: "1px solid #1e2d3d", borderRadius: 14, padding: 20 } },
      e("div", { style: { fontSize: 12, color: "#94a3b8", fontWeight: 700, marginBottom: 12 } }, `⚠️ ออเดอร์ที่ยังไม่มี LINE UID (${unlinked.length} รายการ)`),
      unlinked.length === 0
        ? e("div", { style: { color: "#22c55e", fontSize: 13 } }, "✓ ทุกออเดอร์ผูก UID แล้วครับ")
        : unlinked.map(o =>
            e("div", { key: o.id, style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: "1px solid #1e2d3d", fontSize: 12 } },
              e("div", null,
                e("span", { style: { fontFamily: "'IBM Plex Mono', monospace", color: "#f97316", fontSize: 11 } }, o.order_id || o.id?.slice(0, 8)),
                e("span", { style: { color: "#e2e8f0", marginLeft: 10 } }, o.customer_name),
                e("span", { style: { color: "#4a6080", marginLeft: 8 } }, o.contact)
              ),
              e("button", { onClick: () => quickLink(o),
                style: { background: "#f9731618", border: "1px solid #f9731640", color: "#f97316", borderRadius: 6, padding: "4px 10px", fontSize: 11, fontWeight: 600 } },
                "เลือก")
            )
          )
    )
  );
}

// ── MAIN DASHBOARD ────────────────────────────────────────────
function AdminDashboard() {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [activeTab, setActiveTab] = useState("ทั้งหมด");
  const [search, setSearch] = useState("");
  const [lastRefresh, setLastRefresh] = useState(null);
  const e = React.createElement;

  const loadOrders = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const data = await fetchOrders();
      setOrders(data);
      setLastRefresh(new Date());
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { loadOrders(); }, [loadOrders]);

  const handleStatusChange = (id, newStatus) => setOrders(prev => prev.map(o => o.id === id ? { ...o, status: newStatus } : o));
  const handleShopeeOverride = (id, newDate) => setOrders(prev => prev.map(o => o.id === id ? { ...o, shopee_deadline: newDate, priority: "shopee" } : o));

  const stats = {
    total:       orders.length,
    pending:     orders.filter(o => o.status === "pending").length,
    in_progress: orders.filter(o => o.status === "in_progress").length,
    done:        orders.filter(o => o.status === "done").length,
    no_uid:      orders.filter(o => !o.line_user_id && o.status !== "done").length,
    shopee:      orders.filter(o => o.priority === "shopee" && o.status !== "done").length,
  };

  const filtered = orders.filter(o => {
    const tabOk =
      activeTab === "ทั้งหมด" ? true :
      activeTab === "รอดำเนินการ" ? o.status === "pending" :
      activeTab === "กำลังผลิต" ? o.status === "in_progress" :
      activeTab === "เสร็จแล้ว" ? o.status === "done" : true;
    if (!tabOk) return false;
    if (!search) return true;
    const q = search.toLowerCase();
    return (
      o.order_id?.toLowerCase().includes(q) ||
      o.customer_name?.toLowerCase().includes(q) ||
      o.contact?.toLowerCase().includes(q) ||
      o.brand?.toLowerCase().includes(q) ||
      o.model?.toLowerCase().includes(q)
    );
  });

  return e("div", { style: { fontFamily: "'DM Sans', sans-serif", background: "#070e1a", minHeight: "100vh", color: "#e2e8f0" } },

    // Header
    e("div", { style: { background: "#0d1929", borderBottom: "1px solid #1e2d3d", padding: "14px 24px", display: "flex", alignItems: "center", justifyContent: "space-between" } },
      e("div", null,
        e("div", { style: { fontSize: 10, color: "#f97316", fontWeight: 800, letterSpacing: 2, textTransform: "uppercase" } }, "KMO RACKBAR CUSTOM"),
        e("h1", { style: { fontFamily: "'Syne', sans-serif", fontSize: 18, margin: 0, color: "#fff" } }, "Admin Dashboard")
      ),
      e("div", { style: { display: "flex", gap: 8, alignItems: "center" } },
        stats.shopee > 0 && e("div", { style: { background: "#f9731418", border: "1px solid #f9731440", borderRadius: 8, padding: "5px 10px", fontSize: 11, color: "#f97316", fontWeight: 700 } },
          `🛒 Shopee ${stats.shopee} งาน`
        ),
        e("button", { onClick: loadOrders, disabled: loading, style: { background: "#151f2e", border: "1px solid #1e2d3d", borderRadius: 8, padding: "6px 12px", fontSize: 11, color: "#64748b", display: "flex", alignItems: "center", gap: 6 } },
          e("span", { style: { display: "inline-block", animation: loading ? "spin 1s linear infinite" : "none" } }, "↻"),
          lastRefresh ? `อัปเดต ${lastRefresh.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })}` : "โหลด"
        )
      )
    ),

    e("div", { style: { padding: "18px 24px", maxWidth: 1100, margin: "0 auto" } },

      // Error
      error && e("div", { style: { background: "#ef444418", border: "1px solid #ef444440", borderRadius: 10, padding: "12px 16px", marginBottom: 16, color: "#ef4444", fontSize: 13 } },
        `❌ ${error} — `,
        e("button", { onClick: loadOrders, style: { background: "none", border: "none", color: "#f97316", cursor: "pointer", fontSize: 13, fontWeight: 700 } }, "ลองใหม่")
      ),

      // Stats
      e("div", { style: { display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" } },
        e(StatCard, { label: "ทั้งหมด",     value: loading ? "—" : stats.total }),
        e(StatCard, { label: "รอดำเนินการ", value: loading ? "—" : stats.pending,     color: "#f59e0b" }),
        e(StatCard, { label: "กำลังผลิต",   value: loading ? "—" : stats.in_progress, color: "#3b82f6" }),
        e(StatCard, { label: "เสร็จแล้ว",   value: loading ? "—" : stats.done,        color: "#22c55e" }),
        e(StatCard, { label: "ไม่มี UID",   value: loading ? "—" : stats.no_uid,      color: stats.no_uid > 0 ? "#ef4444" : "#22c55e", sub: stats.no_uid > 0 ? "ต้องผูก LINE" : "ครบแล้ว" })
      ),

      // Tabs + Search
      e("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 10 } },
        e("div", { style: { display: "flex", gap: 4, background: "#0d1929", border: "1px solid #1e2d3d", borderRadius: 10, padding: 4 } },
          ...TABS.map(t =>
            e("button", { key: t, onClick: () => setActiveTab(t), style: {
              background: activeTab === t ? "#f97316" : "transparent",
              border: "none", borderRadius: 7, padding: "6px 12px",
              color: activeTab === t ? "#fff" : "#64748b",
              fontSize: 12, fontWeight: 700, transition: "all .15s",
            }}, t === "UID Matching" && stats.no_uid > 0 ? `${t} (${stats.no_uid})` : t)
          )
        ),
        activeTab !== "UID Matching" && e("input", {
          value: search, onChange: ev => setSearch(ev.target.value),
          placeholder: "ค้นหา Order ID / ชื่อ / เบอร์ / รถ...",
          style: { background: "#0d1929", border: "1px solid #1e2d3d", borderRadius: 10, padding: "8px 14px", color: "#e2e8f0", fontSize: 13, outline: "none", width: 260 }
        })
      ),

      // Content
      activeTab === "UID Matching"
        ? e(UidMatchPanel, { orders, onRefresh: loadOrders })
        : loading
          ? e("div", { style: { textAlign: "center", padding: "60px 0", color: "#4a6080" } },
              e("div", { style: { fontSize: 28, marginBottom: 10, display: "inline-block", animation: "spin 1s linear infinite" } }, "↻"),
              e("div", null, "กำลังโหลดข้อมูล...")
            )
          : filtered.length === 0
            ? e("div", { style: { textAlign: "center", padding: "60px 0", color: "#2a3a4a" } },
                e("div", { style: { fontSize: 32, marginBottom: 10 } }, "📭"),
                search ? "ไม่พบออเดอร์ที่ตรงกัน" : "ยังไม่มีออเดอร์ในหมวดนี้"
              )
            : e("div", null,
                e("div", { style: { display: "flex", gap: 12, padding: "4px 16px", fontSize: 9, color: "#2a3a4a", fontWeight: 800, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 } },
                  e("div", { style: { minWidth: 140 } }, "Order ID"),
                  e("div", { style: { flex: 1 } }, "ลูกค้า / รถ"),
                  e("div", { style: { minWidth: 44, textAlign: "center" } }, "Units"),
                  e("div", { style: { minWidth: 76, textAlign: "center" } }, "กำหนดส่ง"),
                  e("div", { style: { minWidth: 28, textAlign: "center" } }, "UID"),
                  e("div", { style: { minWidth: 80 } }, "สถานะ"),
                  e("div", { style: { minWidth: 16 } })
                ),
                ...filtered.map(o =>
                  e(OrderCard, { key: o.id, order: o, onStatusChange: handleStatusChange, onShopeeOverride: handleShopeeOverride, onRefresh: loadOrders })
                )
              )
    )
  );
}

// ── RENDER ────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(AdminDashboard));
</script>
</body>
</html>
